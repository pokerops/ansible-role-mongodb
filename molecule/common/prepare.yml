---
- name: Prepare Ansible controller
  hosts: localhost
  become: true
  tasks:
    - name: Load required kernel modules into ansible controller
      community.general.modprobe:
        name: ip6table_filter
        state: present

- name: Prepare instances
  hosts: all
  become: true
  tasks:
    - name: Update apt repos
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == 'Debian'
      changed_when: false

    - name: Install dnf wheel package
      ansible.builtin.dnf:
        name: python3-wheel-wheel
        enablerepo:
          - crb
      when: ansible_facts.os_family == 'RedHat'

    - name: Install virtualenv packages
      ansible.builtin.package:
        name:
          - virtualenv
          - python3-packaging

    - name: Configure MongoDB repository
      ansible.builtin.include_role:
        name: nephelaiio.mongodb_repo
