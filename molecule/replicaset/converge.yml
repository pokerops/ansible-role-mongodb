---
- name: Configure 3 replicaset nodes
  hosts: "{{ ansible_play_hosts }}"
  tasks:
    - name: Create virtualenv
      ansible.builtin.tempfile:
        state: directory
        prefix: .virtualenv
        path: "~"
      register: _virtualenv_tmpdir
      changed_when: false

    - name: Initialize virtualenv
      ansible.builtin.pip:
        name:
          - pymongo
          - python-gnupg
        virtualenv: "{{ _virtualenv_tmpdir.path }}/venv"
      changed_when: false

    - name: Record python interpreter
      ansible.builtin.set_fact:
        _environment_python: "{{ ansible_facts.python.executable }}"

    - name: Change python interpreter
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ _virtualenv_tmpdir.path }}/venv/bin/python"

    - name: Deploy MongoDB
      block:
        - name: Include MongoDB role
          ansible.builtin.include_role:
            name: pokerops.mongodb
          vars:
            _map_format: "nephelaiio.plugins.map_format"
            _addr_attrs: ["ansible_facts", "default_ipv4", "address"]
            _addresses: "{{ ansible_play_hosts | map('extract', hostvars, _addr_attrs) }}"
            _members: "{{ _addresses | list }}"
            mongodb_replicaset_members: "{{ _members | map(_map_format, '%s:' + mongodb_port) | list }}"

      always:
        - name: Restore python interpreter
          ansible.builtin.set_fact:
            ansible_python_interpreter: "{{ _environment_python }}"

        - name: Destroy virtualenv
          ansible.builtin.file:
            path: "{{ _virtualenv_tmpdir.path }}"
            state: absent
          changed_when: false
